[project]
name = "decision-tui"
version = "0.1.0"
description = "Generic terminal decision dashboard: renders a JSON decision spec as a Textual TUI, writes answers as JSON"
requires-python = ">=3.12"
dependencies = [
    "textual>=1.0",
    "mcp>=1.2",
    "faster-whisper>=1.0",
    # imported directly for the linkify-enabled markdown parser (clickable
    # bare URLs in ticket context); linkify-it-py is what powers the linkify rule
    "markdown-it-py>=2.2",
    "linkify-it-py>=2.0",
]

[project.scripts]
decision-tui = "decision_tui.app:main"
decision-tui-mcp = "decision_tui.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["decision_tui"]
artifacts = ["decision_tui/assets/*"]
